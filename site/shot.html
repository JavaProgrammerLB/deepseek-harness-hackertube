<!-- 只用来栅格化 site/public/shot.png，不放进站点目录。 -->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>示意图静帧</title>
<style>
  @font-face {
    font-family: "Shot Sans";
    src: url("shot-fonts/noto-sans-sc-400.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 600px; overflow: hidden; background: #fff; }
  body {
    font-family: "Shot Sans", "WenQuanYi Micro Hei", "PingFang SC", sans-serif;
    color: #1c1c1c;
    font-size: 28px;
  }
  .app { width: 1200px; height: 600px; display: flex; background: #fff; }
  .chat {
    width: 508px;
    flex: none;
    display: flex;
    flex-direction: column;
    border-right: 1px solid #e6e6e6;
    background: #fff;
  }
  .chat header, .rail header {
    flex: none;
    height: 92px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    border-bottom: 1px solid #ececec;
  }
  .product { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
  .status { display: inline-flex; align-items: center; gap: 10px; color: #2a6844; font-size: 22px; }
  .status i { width: 12px; height: 12px; background: #2a6844; display: block; }
  .thread { flex: 1; padding: 28px 28px 0; display: flex; flex-direction: column; gap: 22px; }
  .user {
    align-self: flex-end;
    max-width: 92%;
    margin: 0;
    padding: 14px 16px;
    background: #f3f3f3;
    border-radius: 8px;
    font-size: 26px;
    line-height: 1.45;
  }
  .agent { margin: 0; font-size: 26px; line-height: 1.5; }
  .agent p { margin: 0; }
  .meta { margin-top: 10px !important; color: #737373; font-size: 22px; }
  .composer {
    flex: none;
    margin: 20px 24px 24px;
    height: 72px;
    border: 1px solid #e3e3e3;
    border-radius: 8px;
    display: flex;
    align-items: center;
    padding: 0 18px;
    color: #9a9a9a;
    font-size: 24px;
  }
  .rail { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #fff; }
  .rail header { justify-content: flex-start; gap: 14px; }
  .mark {
    width: 42px; height: 42px; flex: none;
    background: #ff6600; color: #fff;
    display: grid; place-items: center;
    font-weight: 600; font-size: 24px; letter-spacing: -0.04em;
    border-radius: 8px;
  }
  .rail-name { display: flex; flex-direction: column; gap: 2px; }
  .rail-name strong { font-size: 28px; font-weight: 600; }
  .rail-name span { color: #737373; font-size: 20px; }
  ul { list-style: none; margin: 0; padding: 0; flex: 1; display: flex; flex-direction: column; }
  li {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 24px;
    border-bottom: 1px solid #efefef;
    min-height: 0;
  }
  li:last-child { border-bottom: 0; }
  li.open { background: #f5f5f4; }
  .thumb { width: 188px; height: 106px; flex: none; position: relative; border-radius: 8px; overflow: hidden; }
  .dur {
    position: absolute; right: 8px; bottom: 8px;
    background: #1a1a1a; color: #fff;
    font-size: 16px; line-height: 1.2; padding: 2px 6px; border-radius: 3px;
  }
  .copy { min-width: 0; }
  .copy h3 { margin: 0; font-size: 28px; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em; }
  .sub { margin: 6px 0 0; color: #737373; font-size: 20px; }
  .opened { margin: 6px 0 0; color: #2a6844; font-size: 20px; }
  .still { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div class="app">
  <section class="chat" aria-label="对话">
    <header>
      <span class="product">DeepSeek Harness</span>
      <span class="status"><i></i>正在干活</span>
    </header>
    <div class="thread">
      <p class="user">空状态太空了，补一句说明。</p>
      <div class="agent">
        <p>在补。说明在上，按钮在下。</p>
        <p class="meta">样式还在写</p>
      </div>
    </div>
    <div class="composer">接着写</div>
  </section>
  <aside class="rail" aria-label="首页列表">
    <header>
      <span class="mark">H</span>
      <div class="rail-name">
        <strong>首页</strong>
        <span>HackerTube.org</span>
      </div>
    </header>
    <ul>
      <li>
        <div class="thumb">
          <svg class="still" viewBox="0 0 188 106" aria-hidden="true">
            <rect width="188" height="106" fill="#e4d9c4"/>
            <rect x="0" y="0" width="188" height="26" fill="#2a312c"/>
            <rect x="22" y="46" width="112" height="8" fill="#2a312c"/>
            <rect x="22" y="64" width="68" height="8" fill="#2a6844"/>
          </svg>
          <span class="dur">1:01:22</span>
        </div>
        <div class="copy">
          <h3>简单，其实最难</h3>
          <p class="sub">讲座 · 1:01:22</p>
        </div>
      </li>
      <li class="open">
        <div class="thumb">
          <svg class="still" viewBox="0 0 188 106" aria-hidden="true">
            <rect width="188" height="106" fill="#1c2430"/>
            <rect x="18" y="22" width="92" height="8" fill="#d5dbe3"/>
            <rect x="18" y="40" width="70" height="8" fill="#d5dbe3"/>
            <rect x="18" y="58" width="108" height="8" fill="#d5dbe3"/>
            <rect x="18" y="76" width="48" height="8" fill="#c4a36a"/>
          </svg>
          <span class="dur">42:15</span>
        </div>
        <div class="copy">
          <h3>一个编译器的下午</h3>
          <p class="sub">黑板 · 42:15</p>
          <p class="opened">已用 Chrome 打开</p>
        </div>
      </li>
      <li>
        <div class="thumb">
          <svg class="still" viewBox="0 0 188 106" aria-hidden="true">
            <rect width="188" height="106" fill="#e6dfd2"/>
            <rect x="28" y="58" width="22" height="32" fill="#2a332c"/>
            <rect x="64" y="34" width="22" height="56" fill="#2a332c"/>
            <rect x="100" y="66" width="22" height="24" fill="#2a332c"/>
            <rect x="136" y="42" width="22" height="48" fill="#2a332c"/>
          </svg>
          <span class="dur">18:40</span>
        </div>
        <div class="copy">
          <h3>延迟那张表</h3>
          <p class="sub">记录 · 18:40</p>
        </div>
      </li>
    </ul>
  </aside>
</div>
</body>
</html>
